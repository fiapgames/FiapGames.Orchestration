# Registra o admin da Konga (credenciais fixas de dev) e cria automaticamente a
# Connection apontando para o Kong deste cluster — sem isso, seria preciso abrir
# http://localhost:1337, cadastrar o usuário manualmente e clicar para ativar a
# connection toda vez que o cluster for recriado (postgres-kong usa emptyDir).
#
# Descoberto testando ao vivo contra a imagem real (nada disso está documentado
# no projeto Konga, que está arquivado):
#
#   1. POST /register cria o usuário admin. É idempotente na prática: se já
#      existe um admin, a rota apenas re-renderiza a página com "already
#      registered" e HTTP 200 — não é um erro fatal, então o wget não falha.
#
#   2. A Connection não tem endpoint HTTP simples de criação — vive só na
#      tabela konga_kong_nodes, inserida direto via SQL.
#
#   3. A connection "ativa" para um usuário NÃO é o campo
#      konga_kong_nodes.active (isso só controla qual nó aparece marcado na
#      lista) — é o campo konga_users.node (FK para konga_kong_nodes.id), que
#      o frontend lê da resposta do LOGIN e guarda em localStorage. Sem setar
#      esse campo, o menu "API GATEWAY" (Services/Routes/Consumers/Plugins)
#      fica escondido mesmo com uma Connection já existindo no banco — e um
#      usuário que já estava logado só vê a mudança depois de deslogar e logar
#      de novo (o valor é lido uma vez, no login, não em tempo real).
apiVersion: batch/v1
kind: Job
metadata:
  name: konga-connect
  namespace: fiapgames
  labels:
    app: konga-connect
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: konga-connect
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-konga
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q --spider http://konga.fiapgames.svc.cluster.local:1337; do
                echo "waiting for konga..."
                sleep 2
              done
        # Credenciais de dev fixas — mesma convenção já usada no resto do
        # projeto (RabbitMQ/Postgres/SQL Server). É o login da própria Konga,
        # sem relação nenhuma com o JWT do gateway.
        - name: register-admin
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              wget -q -O /dev/null --header 'Content-Type: application/json' \
                --post-data '{"username":"admin","email":"admin@fiapgames.local","password":"FiapGames@Admin123","password_confirmation":"FiapGames@Admin123"}' \
                http://konga.fiapgames.svc.cluster.local:1337/register || true
      containers:
        - name: connect
          image: postgres:11.16
          env:
            - name: PGPASSWORD
              value: "kong"
          command:
            - sh
            - -c
            - |
              psql -h postgres-kong.fiapgames.svc.cluster.local -U kong -d konga -v ON_ERROR_STOP=1 -c "
                INSERT INTO konga_kong_nodes (name, kong_admin_url, kong_api_key, kong_version, active, health_checks, \"createdAt\", \"updatedAt\")
                SELECT 'fiapgames', 'http://kong.fiapgames.svc.cluster.local:8001', '', '3.0.0', true, false, now(), now()
                WHERE NOT EXISTS (SELECT 1 FROM konga_kong_nodes);

                UPDATE konga_users SET node = (SELECT id FROM konga_kong_nodes ORDER BY id LIMIT 1)
                WHERE admin = true AND node IS NULL;
              "
