# Polyglot persistence for the Catalog service (Tech Challenge item 4):
# append-only purchase-event history. No other service uses this database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: fiapgames
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "fiapgames-admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "FiapGames@Admin123"
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        # emptyDir like the rest of the infra in this repo: if the pod restarts,
        # the purchase-event history is gone. Acceptable for dev — see README.
        - name: mongodb-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fiapgames
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
