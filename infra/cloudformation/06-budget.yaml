AWSTemplateFormatVersion: "2010-09-09"
Description: FiapGames - monthly cost alert by e-mail.

Parameters:
  MonthlyLimitUsd:
    Type: Number
    Default: 50
  AlertEmail:
    Type: String
    AllowedPattern: .+@.+
    ConstraintDescription: Must be an e-mail address.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: fiapgames-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Forecast warns before the money is spent; actual confirms it was.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
