AWSTemplateFormatVersion: "2010-09-09"
Description: FiapGames - IAM role that GitHub Actions assumes through OIDC to push to ECR and deploy to EKS.

# No AWS access key is ever stored in GitHub: the workflow exchanges its OIDC
# token for this role. The workflow needs "permissions: id-token: write".

Parameters:
  EcrStackName:
    Type: String
    Default: fiapgames-ecr
  EksStackName:
    Type: String
    Default: fiapgames-eks
  GitHubOrg:
    Type: String
    Default: fiapgames
  DeployBranch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can assume the role, so main is what reaches production.
  Namespace:
    Type: String
    Default: fiapgames
  CreateOidcProvider:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: The provider normally comes from 00-base; true only when deploying this stack on its own.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fiapgames-github-actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/*:ref:refs/heads/${DeployBranch}
      Policies:
        - PolicyName: ecr-push-eks-describe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !ImportValue
                    Fn::Sub: ${EcrStackName}-CatalogApiRepositoryArn
                  - !ImportValue
                    Fn::Sub: ${EcrStackName}-UsersApiRepositoryArn
                  - !ImportValue
                    Fn::Sub: ${EcrStackName}-PaymentsApiRepositoryArn
              # Needed by "aws eks update-kubeconfig" in the workflow.
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !ImportValue
                  Fn::Sub: ${EksStackName}-ClusterArn

  # Inside the cluster the role can only edit the application namespace.
  DeployRoleAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !ImportValue
        Fn::Sub: ${EksStackName}-ClusterName
      PrincipalArn: !GetAtt DeployRole.Arn
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
          AccessScope:
            Type: namespace
            Namespaces:
              - !Ref Namespace

Outputs:
  DeployRoleArn:
    Description: Value for role-to-assume in aws-actions/configure-aws-credentials.
    Value: !GetAtt DeployRole.Arn
