AWSTemplateFormatVersion: "2010-09-09"
Description: FiapGames - permanent base that lets GitHub Actions turn the environment on and off.

# Never deleted by "aws.sh down": without it GitHub could not log in again to
# recreate what was turned off. IAM and OIDC cost nothing.

Parameters:
  GitHubOrg:
    Type: String
    Default: fiapgames
  OrchestrationRepo:
    Type: String
    Default: FiapGames.Orchestration
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: An account holds a single GitHub OIDC provider; use false if one already exists.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Creates and deletes VPC, EKS, IAM roles and OpenSearch, so it needs broad
  # rights; only workflows on the Orchestration main branch can assume it.
  InfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fiapgames-github-infra
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${OrchestrationRepo}:ref:refs/heads/main
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  InfraRoleArn:
    Description: Value for the AWS_INFRA_ROLE_ARN variable in GitHub.
    Value: !GetAtt InfraRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-InfraRoleArn
