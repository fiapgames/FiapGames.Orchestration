# Liga e desliga o ambiente da AWS por botão, e desliga sozinho quando ninguém
# usa o gateway por AUTO_OFF_IDLE_MINUTES (padrão 60). Roda nos servidores do
# GitHub, então desliga mesmo com todos os computadores do grupo desligados.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [ligar, desligar, manter-ligado]
        default: ligar
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  id-token: write

# Ligar e desligar nunca rodam juntos. A verificação agendada tem grupo próprio
# para não cancelar um "desligar" que esteja na fila.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'deploy-prod-check' || 'deploy-prod' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IDLE_MINUTES: ${{ vars.AUTO_OFF_IDLE_MINUTES || '60' }}
  EKS_ADMIN_ARN: ${{ vars.EKS_ADMIN_ARN }}
  BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
  # Chaves externas e o login da Konga vêm dos Secrets do repositório; as senhas
  # internas (bancos, RabbitMQ, JWT) o ci/secrets.sh gera a cada "ligar".
  NOTIFICATIONS_FUNCTION_KEY: ${{ secrets.NOTIFICATIONS_FUNCTION_KEY }}
  NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
  KONGA_ADMIN_PASSWORD: ${{ secrets.KONGA_ADMIN_PASSWORD }}
  ACAO: ${{ github.event_name == 'schedule' && 'verificar' || inputs.acao }}

jobs:
  ambiente:
    # Sem a base na AWS ainda, não há o que ligar nem desligar. Só um ARN de
    # verdade libera o job: vazio ou valor provisório não dispara falha a cada 15 min.
    if: startsWith(vars.AWS_INFRA_ROLE_ARN, 'arn:aws:iam::')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      # Lado a lado, como o aws.sh espera: o bootstrap usa os k8s/ de cada serviço.
      - uses: actions/checkout@v7
        with:
          path: FiapGames.Orchestration
      - if: env.ACAO == 'ligar'
        uses: actions/checkout@v7
        with:
          repository: fiapgames/FiapGames.Catalog
          path: FiapGames.Catalog
      - if: env.ACAO == 'ligar'
        uses: actions/checkout@v7
        with:
          repository: fiapgames/Fiap.Games.Users
          path: Fiap.Games.Users
      - if: env.ACAO == 'ligar'
        uses: actions/checkout@v7
        with:
          repository: fiapgames/FiapGames.Payments
          path: FiapGames.Payments

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: ${{ env.ACAO }}
        working-directory: FiapGames.Orchestration
        run: |
          case "$ACAO" in
            ligar) infra/aws.sh up ;;
            desligar) infra/aws.sh down ;;
            manter-ligado) infra/aws.sh keep-alive ;;
            verificar) infra/aws.sh idle-check ;;
          esac
